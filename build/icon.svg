<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Graphictero app icon. macOS (Big Sur+) grid: 824x824 tile centred on a 1024 canvas, 100px margin, ~185px corner radius. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F6F7"/>
      <stop offset="1" stop-color="#C8C9CC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tile)" filter="url(#shadow)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5" fill="none" stroke="#000" stroke-opacity="0.08" stroke-width="1"/>
  <g stroke="#2B2C30" stroke-width="13" stroke-linecap="round" fill="none">
    <line x1="520" y1="524" x2="340" y2="404"/>
    <line x1="520" y1="524" x2="648" y2="322"/>
    <line x1="520" y1="524" x2="704" y2="648"/>
    <line x1="520" y1="524" x2="388" y2="706"/>
    <line x1="340" y1="404" x2="648" y2="322"/>
    <line x1="648" y1="322" x2="704" y2="648"/>
  </g>
  <g fill="#3A3B40">
    <circle cx="340" cy="404" r="40"/>
    <circle cx="648" cy="322" r="34"/>
    <circle cx="704" cy="648" r="46"/>
    <circle cx="388" cy="706" r="32"/>
  </g>
  <circle cx="520" cy="524" r="62" fill="#1C1D20"/>
</svg>
