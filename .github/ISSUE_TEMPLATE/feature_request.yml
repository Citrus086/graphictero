name: 功能建议 / Feature request
description: 提一个想法或改进 / Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题 / What problem would this solve?
      description: 你在什么场景下遇到了不便 / The situation where you ran into it
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望怎么做 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案 / Alternatives considered
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 其他信息 / Additional context
    validations:
      required: false
